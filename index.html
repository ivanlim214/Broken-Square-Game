<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Broken Squares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a workshop table. The cutting mat (board) is the hero; everything else is quiet chrome around it. */
:root{
  --bg:#ECF0EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#17201D; --muted:#5A6863; --line:#D3DBD7;
  --accent:#1E6A51; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --mat:#1D3A31; --mat-line:rgba(255,255,255,.09); --mat-line-strong:rgba(255,255,255,.2); --mat-ink:#CFE6DC;
  --good:#1F8A55; --good-soft:#DDF3E7; --warn:#A86100; --warn-soft:#FBEBD2; --bad:#B4372B; --bad-soft:#F8E0DC;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px rgba(20,30,25,.06);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#172019; --surface-2:#1B2621; --ink:#E4ECE8; --muted:#94A49D; --line:#2A3631;
  --accent:#6FD1A8; --accent-ink:#0B1A14; --accent-soft:#1D3A2F;
  --mat:#16302A; --mat-line:rgba(255,255,255,.07); --mat-line-strong:rgba(255,255,255,.17); --mat-ink:#BFDCCF;
  --good:#5BD394; --good-soft:#173527; --warn:#F0B35A; --warn-soft:#3A2B13; --bad:#F08A7E; --bad-soft:#3D1D19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#172019; --surface-2:#1B2621; --ink:#E4ECE8; --muted:#94A49D; --line:#2A3631;
  --accent:#6FD1A8; --accent-ink:#0B1A14; --accent-soft:#1D3A2F;
  --mat:#16302A; --mat-line:rgba(255,255,255,.07); --mat-line-strong:rgba(255,255,255,.17); --mat-ink:#BFDCCF;
  --good:#5BD394; --good-soft:#173527; --warn:#F0B35A; --warn-soft:#3A2B13; --bad:#F08A7E; --bad-soft:#3D1D19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.conn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;background:var(--warn);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:var(--shadow)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
.shell{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand-mark{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.topbar .grow{flex:1}
.crumb{color:var(--muted);font-size:13px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(44px,8vw,84px);line-height:.9;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:28px;line-height:1;letter-spacing:.02em}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],textarea,select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:64px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.live{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.25)}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero .lede{font-size:17px;color:var(--muted);margin-top:14px}
.hero-mat{background:var(--mat);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:28px}
.entry{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.entry:hover:not(:disabled){border-color:var(--accent)}
.entry:disabled{cursor:not-allowed;opacity:.55}
.entry .k{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.entry .go{margin-top:auto;color:var(--accent);font-weight:700;font-size:14px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rulelist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.notice{border-radius:8px;padding:10px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid transparent;font-size:14px}
.notice.info{background:var(--accent-soft)}
.credit{margin-top:28px;font-size:12px;color:var(--muted)}

/* Sessions, seats */
.list{display:flex;flex-direction:column;gap:8px}
.sess{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sess .grow{flex:1;min-width:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.team-h{display:flex;align-items:center;gap:8px}
.team-h b{flex:1}
.seats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seat{border:1px solid var(--line);border-radius:7px;padding:6px 4px;background:var(--surface-2);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.seat .n{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1}
.seat .who{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.taken{cursor:default;background:var(--surface)}
.seat.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.seat:disabled{cursor:default}
.seat.done{background:var(--good-soft)}

/* Play */
.playhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.playhead .grow{flex:1}
.clock{font-family:var(--f-mono);font-weight:700;font-size:26px;letter-spacing:.02em}
.silence{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.silence span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;background:var(--surface);border:1px dashed var(--muted);color:var(--muted)}
.banner{border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.banner.wait{background:var(--surface);border:1px solid var(--line)}
.banner.go{background:var(--accent);color:var(--accent-ink)}
.banner.win{background:var(--good);color:#fff}
.banner .big{font-family:var(--f-display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:1}
.mates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.mate{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:default}
.mate.target{cursor:pointer;border-style:dashed;border-color:var(--accent)}
.mate.hover{background:var(--accent-soft);border-style:solid}
.mate-h{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.mate-h .n{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1}
.mate-h .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.mate .give{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.mate-hidden{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:18/10;border-radius:6px;background:var(--surface-2);border:1px dashed var(--line);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.minimat{display:block;width:100%;height:auto;border-radius:6px;background:var(--mat)}
.boardwrap{background:var(--mat);border-radius:14px;padding:10px;box-shadow:var(--shadow);position:relative}
.board{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.board .pc{cursor:grab;outline:none}
.board .pc.locked{cursor:default}
.board .pc:focus-visible polygon{stroke:#fff;stroke-width:.12}
.board .pc.sel polygon{stroke:#fff;stroke-width:.12;filter:drop-shadow(0 0 .15px #fff)}
.board .pc.dragging{cursor:grabbing;pointer-events:none;opacity:.92}
.board .pc.fresh polygon{animation:fresh 1.4s ease-out 2}
@keyframes fresh{0%{stroke:#fff;stroke-width:.25}100%{stroke-width:.05}}
@media (prefers-reduced-motion:reduce){.board .pc.fresh polygon{animation:none}}
.actionbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actionbar .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.actionbar .sep{width:1px;align-self:stretch;background:var(--line);margin-inline:4px}
.hint{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Observer / host */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.boards5{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto;font-size:13px}
.log div{display:flex;gap:8px}
.log .t{font-family:var(--f-mono);color:var(--muted);flex:none}
.q{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q .qn{font-weight:600;font-size:14px}
.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tally button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;font-weight:600}
.tally b{font-family:var(--f-mono);font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.prog i.on{background:var(--good);border-color:var(--good)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--bad);border-radius:8px;background:var(--bad-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;border-radius:10px;padding:8px;line-height:0;flex:none}
.qr svg{width:100%;height:auto;display:block}
.qrov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.qrov .qr{width:min(70vmin,460px);padding:16px;box-shadow:var(--shadow)}
.qrov .bigcode{font-family:var(--f-mono);font-weight:700;font-size:clamp(28px,6vw,48px);letter-spacing:.12em}
.qrov .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.linkline{font-family:var(--f-mono);font-size:12px;word-break:break-all;color:var(--muted);user-select:all}
.debrief ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.solved{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .entries{grid-template-columns:1fr}
  .rules{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
}
@media (max-width:560px){
  .mates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock{font-size:22px}
  h2{font-size:24px}
}
</style>
</head>
<body>

<div class="shell" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="qrov" id="qrov" hidden role="dialog" aria-modal="true" aria-label="Scan to join"></div>
<div class="conn" id="conn" hidden role="status">Reconnecting… your moves will sync when you're back online</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
(function(){
"use strict";
/* ============ Geometry ============ */
// Pieces in inches, from the five 6"x6" squares in the original instructions.
const SHAPES={
  A:[[0,0],[3,0],[3,3]],
  B:[[0,0],[3,0],[6,3],[6,6],[3,6],[0,3]],
  C:[[0,0],[3,3],[3,6],[0,6]],
  D:[[0,0],[6,0],[3,3]],
  E:[[0,0],[3,0],[3,6],[0,6]],
  F:[[0,0],[3,0],[0,6]],
  G:[[0,0],[3,0],[3,3],[0,3]],
  H:[[0,0],[3,0],[3,3],[6,3],[6,6],[3,6],[0,3]],
  I:[[0,0],[6,0],[6,6]],
  J:[[0,0],[6,6],[3,6],[0,3]]
};
const SHAPE_NAMES={A:"small triangle",B:"six-sided piece",C:"four-sided piece",D:"wide triangle",E:"rectangle",F:"long triangle",G:"small square",H:"notched piece",I:"large triangle",J:"diagonal strip"};
// Same 15 pieces either way. Only one split makes all five squares: B+A+A, G+H+A, I+J+A, C+C+D, E+F+F.
// "trap": seat 3 opens I, D, A, A, which already makes a square, but a dead-end one. The team can only
// finish if seat 3 breaks it up and gives pieces away. No other seat can make a square on its own.
const DEALS={
  trap:{1:["H","E","C"],2:["A","A","J"],3:["I","D","A","A"],4:["F","C","G"],5:["B","F"]},
  classic:{1:["I","H","E"],2:["A","A","A","C"],3:["A","J"],4:["D","F"],5:["G","B","F","C"]}
};
const TRAP_SEAT=3;
const GOOD_SQUARES=new Set(["AAB","AGH","AIJ","CCD","EFF"]);
const recipe=pcs=>pcs.map(p=>p.letter).sort().join("");
const B={W:18,H:10,FX:1,FY:2,SPLIT:8}; // canonical board: build area left (x<8), pieces tray right
const SETS=[
  {name:"Amber",c:"#F2B33D"},{name:"Cobalt",c:"#5D88F2"},{name:"Coral",c:"#F0765C"},{name:"Lilac",c:"#B590F2"},
  {name:"Citron",c:"#D6DE5C"},{name:"Sky",c:"#62C6EA"},{name:"Rose",c:"#EE84B4"},{name:"Mint",c:"#86E2B6"},
  {name:"Sand",c:"#E8C99A"},{name:"Cherry",c:"#E2605F"}
];
const setOf=t=>SETS[(t-1)%SETS.length];
const teamName=t=>"Team "+t;

const shapeCache={};
function shapeOf(p){
  const key=p.letter+p.rot+(p.flip?1:0);
  if(shapeCache[key]) return shapeCache[key];
  let pts=SHAPES[p.letter].map(([x,y])=>[p.flip?-x:x,y]);
  for(let i=0;i<p.rot;i++) pts=pts.map(([x,y])=>[-y,x]);
  const mx=Math.min(...pts.map(q=>q[0])), my=Math.min(...pts.map(q=>q[1]));
  pts=pts.map(([x,y])=>[x-mx,y-my]);
  const w=Math.max(...pts.map(q=>q[0])), h=Math.max(...pts.map(q=>q[1]));
  // area centroid for the label
  let a=0,cx=0,cy=0;
  for(let i=0;i<pts.length;i++){const [x0,y0]=pts[i],[x1,y1]=pts[(i+1)%pts.length];const f=x0*y1-x1*y0;a+=f;cx+=(x0+x1)*f;cy+=(y0+y1)*f;}
  a/=2; cx/=(6*a); cy/=(6*a);
  return shapeCache[key]={pts,w,h,cx,cy};
}
function pip(x,y,pts){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins;}return ins;}
// Sample grid offsets chosen so no sample point ever lies on a piece edge.
function squareStatus(pcs){
  const shaped=pcs.map(p=>{const s=shapeOf(p);return s.pts.map(([a,b])=>[a+p.x,b+p.y]);});
  const inFrame=pts=>pts.every(([x,y])=>x>=B.FX-1e-6&&x<=B.FX+6+1e-6&&y>=B.FY-1e-6&&y<=B.FY+6+1e-6);
  let filled=0,bad=false;
  for(let i=0;i<24;i++)for(let j=0;j<24;j++){
    const px=B.FX+.07+i*.25, py=B.FY+.19+j*.25; let c=0;
    for(const pts of shaped){ if(pip(px,py,pts)){ c++; if(!inFrame(pts)) bad=true; } }
    if(c>=1) filled++; if(c!==1) bad=true;
  }
  return {done:!bad&&filled===576, fill:filled/576};
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function clampCanon(p){
  const s=shapeOf(p);
  if(p.x+s.w/2<B.SPLIT){ p.x=clamp(p.x,0,B.SPLIT-s.w); p.y=clamp(p.y,1,9-s.h); }
  else { p.x=clamp(p.x,B.SPLIT,B.W-s.w); p.y=clamp(p.y,0,B.H-s.h); }
  return p;
}
function toDisp(p,portrait){
  if(!portrait) return [p.x,p.y];
  const s=shapeOf(p);
  return (p.x+s.w/2<B.SPLIT)?[p.x+1,p.y-1]:[p.x-8,p.y+8];
}
function fromDisp(p,dx,dy,portrait){
  const s=shapeOf(p); let x,y;
  if(!portrait){x=dx;y=dy;}
  else if(dy+s.h/2<8){x=dx-1;y=dy+1; x=Math.min(x,B.SPLIT-s.w);}
  else {x=dx+8;y=dy-8; x=Math.max(x,B.SPLIT);}
  return clampCanon({...p,x:Math.round(x),y:Math.round(y)});
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rectsOverlap(a,b){return a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;}
function findSpot(p,occ){
  for(let r=0;r<4;r++){
    const q={...p,rot:(p.rot+r)%4}; const s=shapeOf(q);
    for(let y=0;y<=B.H-s.h;y++)for(let x=B.SPLIT;x<=B.W-s.w;x++){
      const rc={x,y,w:s.w,h:s.h};
      if(!occ.some(o=>rectsOverlap(o,rc))) return {rot:q.rot,x,y};
    }
  }
  const s=shapeOf(p); const k=occ.length%4;
  return {rot:p.rot,x:B.W-s.w-k,y:B.H-s.h-k*.0};
}
function trayRects(pcs){return pcs.filter(p=>p.x+shapeOf(p).w/2>=B.SPLIT).map(p=>{const s=shapeOf(p);return{x:p.x,y:p.y,w:s.w,h:s.h};});}
function teamTemplate(team,deal){
  const ENVELOPES=DEALS[deal]||DEALS.trap;
  const out=[]; let idx=0;
  for(let seat=1;seat<=5;seat++){
    const rng=mulberry(team*977+seat*131+7); const occ=[];
    ENVELOPES[seat].forEach((letter,i)=>{
      const p={team,idx:idx++,letter,home:seat,owner:seat,rot:Math.floor(rng()*4),flip:rng()<.35,z:i+1};
      const spot=findSpot(p,occ); p.rot=spot.rot; p.x=spot.x; p.y=spot.y;
      const s=shapeOf(p); occ.push({x:p.x,y:p.y,w:s.w,h:s.h});
      out.push(p);
    });
  }
  return out;
}
const pkey=(team,idx)=>"t"+team+"p"+idx;

/* ============ Store operations ============ */
function piecesOf(team,seat){return Object.values(S.pieces).filter(p=>p.team===team&&(seat==null||p.owner===seat));}
function soloPieces(seat){return Object.values(S.solo.pieces).filter(p=>seat==null||p.owner===seat);}
function curPieces(){return S.view==="solo"?S.solo.pieces:S.pieces;}
const piecePath=p=>`pieces/${S.code}/t${p.team}/p${p.idx}`;

async function movePiece(k,patch){
  const map=curPieces(); const p=map[k]; if(!p) return;
  const next=clampCanon({...p,...patch});
  map[k]=next;
  afterLocalChange(next.team,next.owner);
  if(S.view==="solo") return;
  try{ await R(piecePath(next)).update({x:next.x,y:next.y,rot:next.rot,flip:!!next.flip,z:next.z||0,movedAt:now()}); }
  catch(e){ toast("That move didn't save. Check your connection and try again."); }
}
// After the mover's own change, log a square formed / broken and team finish.
function afterLocalChange(team,seat){
  const solo=S.view==="solo";
  const mine=solo?soloPieces(seat):piecesOf(team,seat);
  const done=squareStatus(mine).done;
  const key=team+":"+seat;
  S._sq=S._sq||{};
  const was=S._sq[key]; S._sq[key]=done;
  if(was!==undefined&&was!==done) logEvent({team,type:done?"square":"unsquare",seat});
  if(done){
    const all=[1,2,3,4,5].every(s=>squareStatus(solo?soloPieces(s):piecesOf(team,s)).done);
    if(all&&!teamDoneAt(team)) logEvent({team,type:"done",seat});
  }
  if(solo&&!S.solo.startedAt) S.solo.startedAt=Date.now();
  update();
}
function logEvent(ev){
  if(S.view==="solo"){ ev.t=Date.now(); S.solo.events.push(ev); if(ev.type==="done"){S.solo.doneAt=ev.t;} return; }
  ev.t=now();
  S.events.push(ev);
  R(`events/${S.code}/t${ev.team}`).push(ev).catch(()=>{});
}
async function givePiece(k,toSeat){
  const map=curPieces(); const p=map[k]; if(!p||p.owner===toSeat) return;
  const from=p.owner;
  const theirs=(S.view==="solo"?soloPieces(toSeat):piecesOf(p.team,toSeat));
  const spot=findSpot(p,trayRects(theirs));
  const z=Math.max(0,...Object.values(map).map(q=>q.z||0))+1;
  const next={...p,owner:toSeat,rot:spot.rot,x:spot.x,y:spot.y,z};
  map[k]=next; S.selected=null;
  logEvent({team:p.team,type:"give",from,to:toSeat,letter:p.letter});
  afterLocalChange(p.team,from);
  S._sq[p.team+":"+toSeat]=squareStatus(S.view==="solo"?soloPieces(toSeat):piecesOf(p.team,toSeat)).done;
  if(S.view==="solo"){ S.fresh[k]=Date.now(); update(); return; }
  toast("Given to seat "+toSeat);
  try{ await R(piecePath(next)).update({owner:toSeat,x:next.x,y:next.y,rot:next.rot,z,movedAt:now(),givenAt:now(),from}); }
  catch(e){ toast("That give didn't save. Try again."); }
}
function teamDoneAt(team){
  const evs=S.view==="solo"?S.solo.events:S.events;
  const d=evs.filter(e=>e.team===team&&e.type==="done").sort((a,b)=>a.t-b.t)[0];
  return d?d.t:null;
}

/* ============ Live session wiring ============ */
function teamPieces(team,obj){
  const out={}; Object.values(obj||{}).forEach(p=>{ if(p&&p.letter){ out[pkey(p.team||team,p.idx)]={...p,flip:!!p.flip}; } }); return out;
}
function subscribeSession(code,{team,all}){
  clearSubs(); S.pieces={}; S.events=[]; S.seats={}; S.notes={}; S._sq={};
  S.code=code; S.sessionMissing=false;
  const loadT=setTimeout(()=>{ if(!S.session) toast("Still connecting to the session…"); },10000);
  unsubs.push(()=>clearTimeout(loadT));
  unsubs.push(listen(`sessions/${code}`,v=>{
    clearTimeout(loadT);
    if(v){S.session={id:code,...v};S.sessionMissing=false;} else {S.session=null;S.sessionMissing=true;}
    update();
  }));
  unsubs.push(listen(`seats/${code}`,v=>{S.seats=v||{};update();}));
  unsubs.push(listen(all?`pieces/${code}`:`pieces/${code}/t${team}`,v=>{
    let next={};
    if(all){ Object.entries(v||{}).forEach(([tk,obj])=>Object.assign(next,teamPieces(+tk.slice(1),obj))); }
    else next=teamPieces(team,v);
    Object.entries(next).forEach(([k,d])=>{
      const old=S.pieces[k];
      if(S.me&&!S.me.observer&&old&&old.owner!==d.owner&&d.owner===S.me.seat&&d.team===S.me.team) S.fresh[k]=Date.now();
    });
    if(S.drag&&S.pieces[S.drag.k]) next[S.drag.k]=S.pieces[S.drag.k];
    S.pieces=next;
    // seed square memory so we only log changes made after joining
    Object.values(S.pieces).forEach(p=>{const key=p.team+":"+p.owner; if(S._sq[key]===undefined) S._sq[key]=squareStatus(piecesOf(p.team,p.owner)).done;});
    if(S.drag) S.pendingRender=true; else update();
  }));
  unsubs.push(listen(all?`events/${code}`:`events/${code}/t${team}`,v=>{
    const list=[];
    if(all) Object.values(v||{}).forEach(tobj=>Object.values(tobj||{}).forEach(e=>list.push(e)));
    else Object.values(v||{}).forEach(e=>list.push(e));
    S.events=list.sort((a,b)=>a.t-b.t); update();
  }));
  unsubs.push(listen(`notes/${code}`,v=>{S.notes=v||{};updateNotesIfIdle(); if(S.view==="host") update(); else if(S.view==="observe") updateTally();}));
}
async function resumeLive(last){
  try{
    const s=await R(`sessions/${last.code}`).get(); if(!s.exists()) { lsSet("bs.me",null); return; }
    S.session={id:last.code,...s.val()};
    if(last.observer){ S.me={team:last.team,observer:true}; S.obsTeam=last.team; subscribeSession(last.code,{team:last.team}); go("observe"); return; }
    if(last.host){ if(!(s.val().hosts||{})[S.uid]) return; S.me=null; subscribeSession(last.code,{all:true}); go("host"); return; }
    const seat=await R(`seats/${last.code}/t${last.team}s${last.seat}`).get();
    if(seat.exists()&&seat.val().uid===S.uid){ S.me={team:last.team,seat:last.seat}; subscribeSession(last.code,{team:last.team}); go("play"); }
  }catch(e){console.warn(e);}
}
async function claimSeat(code,team,seat){
  const nick=(S.nick||"").trim().slice(0,24); if(!nick){toast("Type your name first.");$("#nick")&&$("#nick").focus();return;}
  lsSet("bs.nick",nick);
  const ref=R(`seats/${code}/t${team}s${seat}`);
  try{
    const res=await ref.transaction(cur=>{ if(cur&&cur.uid&&cur.uid!==S.uid) return; return {uid:S.uid,nick,team,seat,at:now()}; });
    if(!res.committed){toast("Someone just took that seat. Pick another.");return;}
    if(S.me&&!S.me.observer&&S.code===code&&(S.me.team!==team||S.me.seat!==seat)) await releaseMySeat();
    S.me={team,seat}; lsSet("bs.me",{code,team,seat});
    subscribeSession(code,{team}); go("play");
  }catch(e){console.warn(e);toast("Couldn't take the seat. Check your connection and try again.");}
}
async function releaseMySeat(){
  if(!S.me||S.me.observer||!S.code) return;
  try{ await R(`seats/${S.code}/t${S.me.team}s${S.me.seat}`).transaction(cur=>cur&&cur.uid===S.uid?null:undefined); }catch(e){}
}
// Presence: the seat stays reserved while a player is away; teammates and the facilitator see "Away".
let presenceRef=null;
function markPresence(on){
  if(!FB.rdb||!S.code||!S.me||S.me.observer) return;
  const ref=R(`seats/${S.code}/t${S.me.team}s${S.me.seat}/online`);
  try{
    if(on){ ref.onDisconnect().set(false); ref.set(true).catch(()=>{}); presenceRef=ref; }
    else { ref.onDisconnect().cancel(); ref.set(false).catch(()=>{}); presenceRef=null; }
  }catch(e){}
}
async function freeSeat(id){
  try{ await R(`seats/${S.code}/${id}`).remove(); toast("Seat freed. The player can scan again to rejoin."); }catch(e){toast("Couldn't free that seat.");}

function piecesFor(teams,deal){
  const out={};
  for(let t=1;t<=teams;t++){ const o={}; teamTemplate(t,deal).forEach(p=>o["p"+p.idx]={...p,movedAt:0}); out["t"+t]=o; }
  return out;
}
async function createSession(title,teams,deal,pin){
  try{
    let code=code4();
    for(let i=0;i<6;i++){ const ex=await R(`sessions/${code}`).get(); if(!ex.exists()) break; code=code4(); }
    toast("Setting out envelopes…");
    await R(`hostpins/${code}`).set(pin);
    await R(`sessions/${code}`).set({title:title||"Broken Squares",teams,deal,status:"lobby",createdAt:now(),hosts:{[S.uid]:true}});
    await R(`pieces/${code}`).set(piecesFor(teams,deal));
    lsSet("bs.me",{code,host:true});
    S.session={id:code,title:title||"Broken Squares",teams,deal,status:"lobby",hosts:{[S.uid]:true}};
    subscribeSession(code,{all:true}); S.hostTab="teams"; go("host");
  }catch(e){ console.warn(e); toast("Couldn't create the session. Check your connection and try again."); }
}

async function setStatus(status){
  const s=S.session; const patch={status};
  if(status==="running"&&s.status==="lobby") patch.startedAt=now()+3000;
  if(status==="running"&&s.status==="paused"){ const pausedFor=now()-(s.pausedAt||now()); patch.startedAt=(s.startedAt||now())+pausedFor; patch.pausedAt=null; }
  if(status==="paused") patch.pausedAt=now();
  if(status==="ended") patch.endedAt=now();
  try{await R(`sessions/${S.code}`).update(patch);}catch(e){toast("Couldn't update the session.");}
}
async function resetSession(){
  toast("Resetting envelopes…");
  try{
    await R(`sessions/${S.code}`).update({status:"lobby",startedAt:null,endedAt:null,pausedAt:null});
    await R(`pieces/${S.code}`).set(piecesFor(S.session.teams,S.session.deal));
    await R(`events/${S.code}`).remove();
    await R(`notes/${S.code}`).remove();
    S._sq={};
    toast("Envelopes reset. Ready for a new round.");
  }catch(e){toast("Reset didn't finish. Try again.");}
}
async function resetTeam(t){
  toast("Resetting "+teamName(t)+"…");
  try{
    const o={}; teamTemplate(t,S.session.deal).forEach(p=>o["p"+p.idx]={...p,movedAt:0});
    await R(`pieces/${S.code}/t${t}`).set(o);
    await R(`events/${S.code}/t${t}`).remove();
    await R(`notes/${S.code}/t${t}`).remove();
    for(let n=1;n<=5;n++) delete S._sq[t+":"+n];
    toast(teamName(t)+" is back to its starting envelopes.");
  }catch(e){toast("Reset didn't finish. Try again.");}
}
async function deleteSession(){
  const code=S.code;
  try{
    await R(`pieces/${code}`).remove(); await R(`events/${code}`).remove(); await R(`notes/${code}`).remove(); await R(`seats/${code}`).remove();
    await R(`sessions/${code}`).remove();
    clearSubs(); lsSet("bs.me",null); S.code=null; S.session=null; go("host-list"); toast("Session deleted.");
  }catch(e){toast("Couldn't delete the session.");}
}
// Player: move every piece out of the build area back to your own tray. Ownership doesn't change.
async function clearMySquare(){
  if(!canPlay()) return;
  const solo=S.view==="solo"; const seat=solo?S.solo.seat:S.me.seat; const team=solo?1:S.me.team;
  const mine=solo?soloPieces(seat):piecesOf(team,seat);
  const inBuild=mine.filter(p=>p.x+shapeOf(p).w/2<B.SPLIT);
  if(!inBuild.length){toast("Your build area is already empty.");return;}
  const occ=trayRects(mine); S.selected=null;
  for(const p of inBuild){
    const spot=findSpot(p,occ); const sh=shapeOf({...p,rot:spot.rot}); occ.push({x:spot.x,y:spot.y,w:sh.w,h:sh.h});
    await movePiece(pkey(p.team,p.idx),{x:spot.x,y:spot.y,rot:spot.rot});
  }
}

/* ============ Clock ============ */
function clockFor(team){
  if(S.view==="solo"){const so=S.solo; if(!so.startedAt) return {ms:0,label:"Ready"}; return {ms:(so.doneAt||Date.now())-so.startedAt,label:so.doneAt?"Solved":"Running"};}
  const s=S.session; if(!s) return {ms:0,label:""};
  if(!s.startedAt) return {ms:0,label:"Waiting for signal"};
  const done=team?teamDoneAt(team):null;
  const end=done||s.endedAt||(s.status==="paused"?s.pausedAt:null)||now();
  const ms=end-s.startedAt;
  if(ms<0) return {ms:0,label:"Starting in "+Math.ceil(-ms/1000),count:Math.ceil(-ms/1000)};
  return {ms,label:done?"Team finished":s.status==="paused"?"Paused":s.status==="ended"?"Ended":"Running"};
}
function canPlay(){
  if(S.view==="solo") return true;
  const s=S.session; if(!s||s.status!=="running"||!s.startedAt) return false;
  return now()>=s.startedAt;
}
let lastPlayable=null;
setInterval(()=>{
  document.querySelectorAll("[data-clock]").forEach(el=>{const t=+el.dataset.clock||null;const c=clockFor(t);el.textContent=fmt(c.ms);});
  document.querySelectorAll("[data-clocklabel]").forEach(el=>{const t=+el.dataset.clocklabel||null;el.textContent=clockFor(t).label;});
  const p=canPlay(); if(p!==lastPlayable){lastPlayable=p; if(S.view==="play") update();}
},400);

/* ============ Rendering: board SVGs ============ */
function matGrid(w,h){
  let g=`<rect x="0" y="0" width="${w}" height="${h}" fill="var(--mat)"/>`;
  for(let x=1;x<w;x++) g+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${x%3===0?"var(--mat-line-strong)":"var(--mat-line)"}" stroke-width="0.03"/>`;
  for(let y=1;y<h;y++) g+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${y%3===0?"var(--mat-line-strong)":"var(--mat-line)"}" stroke-width="0.03"/>`;
  return g;
}
function pieceSVG(p,portrait,opts){
  const s=shapeOf(p); const [dx,dy]=toDisp(p,portrait); const col=setOf(p.team).c;
  const cls=["pc"]; if(opts.interactive){ if(S.selected===p.k) cls.push("sel"); if(S.fresh[p.k]&&Date.now()-S.fresh[p.k]<4000) cls.push("fresh"); if(!opts.playable) cls.push("locked"); }
  const pts=s.pts.map(q=>q.join(",")).join(" ");
  const label=opts.mini?"":`<text x="${s.cx}" y="${s.cy}" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, monospace" font-weight="700" font-size="0.62" fill="rgba(0,0,0,.55)" pointer-events="none">${p.home}</text>`;
  const a11y=opts.interactive?` tabindex="0" role="button" aria-label="Piece marked ${p.home}, ${SHAPE_NAMES[p.letter]}"`:"";
  return `<g class="${cls.join(" ")}" data-k="${p.k}" transform="translate(${dx} ${dy})"${a11y}><polygon points="${pts}" fill="${col}" stroke="rgba(0,0,0,.45)" stroke-width="0.05" stroke-linejoin="round"/>${label}</g>`;
}
function boardSVG(pcs,{portrait=false,interactive=false,mini=false,playable=true,id=""}={}){
  const W=portrait?10:B.W, H=portrait?18:B.H;
  const fx=portrait?2:B.FX, fy=portrait?1:B.FY;
  const list=pcs.map(p=>({...p,k:p.k||pkey(p.team,p.idx)})).sort((a,b)=>(a.z||0)-(b.z||0));
  let s=`<svg ${id?`id="${id}"`:""} class="${mini?"minimat":"board"}" viewBox="${mini?"0 0 18 10":`0 0 ${W} ${H}`}" xmlns="http://www.w3.org/2000/svg" ${mini?'aria-hidden="true"':'role="group" aria-label="Your table"'}>`;
  s+=matGrid(mini?18:W,mini?10:H);
  if(!mini){
    const split=portrait?`<line x1="0" y1="8" x2="${W}" y2="8" stroke="var(--mat-line-strong)" stroke-width="0.04" stroke-dasharray="0.2 0.2"/>`:`<line x1="8" y1="0" x2="8" y2="${H}" stroke="var(--mat-line-strong)" stroke-width="0.04" stroke-dasharray="0.2 0.2"/>`;
    s+=split;
    s+=`<text x="${portrait?0.3:0.3}" y="${portrait?0.6:0.6}" font-size="0.42" fill="var(--mat-ink)" font-family="Public Sans, sans-serif" font-weight="700" letter-spacing="0.04">BUILD YOUR SQUARE</text>`;
    s+=`<text x="${portrait?0.3:8.3}" y="${portrait?8.6:0.6}" font-size="0.42" fill="var(--mat-ink)" font-family="Public Sans, sans-serif" font-weight="700" letter-spacing="0.04">YOUR PIECES</text>`;
  }
  const ffx=mini?B.FX:fx, ffy=mini?B.FY:fy;
  s+=`<rect x="${ffx}" y="${ffy}" width="6" height="6" fill="rgba(255,255,255,.04)" stroke="var(--mat-ink)" stroke-width="${mini?0.08:0.05}" stroke-dasharray="${mini?"0.3 0.2":"0.25 0.15"}"/>`;
  if(!mini) s+=`<text x="${ffx+3}" y="${ffy+6.55}" text-anchor="middle" font-size="0.36" fill="var(--mat-ink)" font-family="JetBrains Mono, monospace">6 in × 6 in</text>`;
  list.forEach(p=>{s+=pieceSVG(p,mini?false:portrait,{interactive,mini,playable});});
  s+=`</svg>`; return s;
}

/* ---- Observer ---- */
const OBS_QS=[
  "Who is willing to give away pieces?",
  "Does anyone finish their own square and then step back from the problem?",
  "Is anyone struggling with their pieces yet unwilling to give any away?",
  "How many people are actively putting pieces together?",
  "What is the level of frustration and anxiety?",
  "Is there a turning point where the group begins to cooperate?",
  "Does anyone break the rules by talking or pointing to help others?"
];
const TALLIES=[["talk","Talking"],["point","Pointing or gesturing"],["ask","Asking for a piece"],["take","Taking a piece"]];
function seatStats(team){
  const s=S.session; const evs=S.events.filter(e=>e.team===team);
  const tnow=s&&s.status==="ended"?s.endedAt:now();
  const done=teamDoneAt(team);
  const rows=[];
  for(let n=1;n<=5;n++){
    const pcs=piecesOf(team,n); const st=squareStatus(pcs);
    const gave=evs.filter(e=>e.type==="give"&&e.from===n); const got=evs.filter(e=>e.type==="give"&&e.to===n);
    const sq=evs.filter(e=>e.type==="square"&&e.seat===n).pop();
    const lastGive=gave.length?gave[gave.length-1].t:null;
    let flag="";
    if(st.done&&!done&&!GOOD_SQUARES.has(recipe(pcs))) flag="Holding a dead-end square. The team can't finish until it's broken up";
    else if(s&&s.startedAt&&!done&&s.status!=="lobby"){
      if(st.done&&sq&&(!lastGive||lastGive<sq.t)&&tnow-sq.t>60000) flag="Holding a finished square, no gives since";
      else if(!st.done&&gave.length===0&&tnow-s.startedAt>180000) flag="Hasn't given any pieces yet";
    }
    const d=S.seats["t"+team+"s"+n];
    rows.push({n,nick:d&&d.uid?d.nick+(d.online===false?" (away)":""):"Empty",st,gave:gave.length,got:got.length,pieces:pcs.length,sqAt:sq&&st.done?sq.t:null,flag,dead:st.done&&!GOOD_SQUARES.has(recipe(pcs))});
  }
  return rows;
}

function bannerObs(t){
  const s=S.session; if(!s) return "";
  const done=teamDoneAt(t);
  if(done) return `<div class="banner win"><span class="big">Finished</span><span>${teamName(t)} completed all five squares in <span class="mono">${fmt(done-s.startedAt)}</span>.</span></div>`;
  const trap=(s.deal||"classic")==="trap"?`<span class="small" style="font-weight:500">Seat ${TRAP_SEAT}'s envelope already makes a square, but the wrong one. Watch whether they notice, and whether they break it up and give pieces away.</span>`:"";
  if(s.status==="lobby") return `<div class="banner wait">Waiting for the facilitator's start signal. ${trap}</div>`;
  return trap?`<div class="banner wait">${trap}</div>`:"";
}
function evText(e){
  if(e.type==="give") return `Seat ${e.from} gave a piece to seat ${e.to}`;
  if(e.type==="square") return `Seat ${e.seat} completed a square`;
  if(e.type==="done") return `<b>Team finished: all five squares</b>`;
  return "";
}
let noteTimer=null, noteDirty={};
function updateNotesIfIdle(){
  if(S.view!=="observe") return;
  const n=S.notes["t"+S.obsTeam]||{}; const a=n.answers||{};

async function saveNotes(patch){
  const flat={}; Object.entries(patch.answers||{}).forEach(([k,v])=>flat["answers/"+k]=String(v).slice(0,4000));
  try{ await R(`notes/${S.code}/t${S.obsTeam}`).update(flat); return true; }
  catch(e){ toast("Notes didn't save. Check your connection."); return false; }
}

function debriefHTML(){
  const s=S.session; const rows=[];
  for(let t=1;t<=s.teams;t++){
    const done=teamDoneAt(t); const evs=S.events.filter(e=>e.team===t);
    const gives=evs.filter(e=>e.type==="give"); const firstGive=gives[0];
    const sq=[1,2,3,4,5].filter(n=>squareStatus(piecesOf(t,n)).done).length;
    const n=S.notes["t"+t]||{}; const tl=n.tallies||{}; const breaks=Object.values(tl).reduce((a,b)=>a+(b||0),0);
    rows.push(`<tr><td><span class="dot" style="background:${setOf(t).c}"></span> ${teamName(t)}</td><td class="num">${done?fmt(done-s.startedAt):"—"}</td><td class="num">${sq}/5</td><td class="num">${gives.length}</td><td class="num">${firstGive&&s.startedAt?fmt(firstGive.t-s.startedAt):"—"}</td><td class="num">${breaks}</td></tr>`);
  }
  return `<div class="cols"><div class="panel stack"><h3>Results by team</h3><div class="tbl-wrap"><table><thead><tr><th>Team</th><th>Finish time</th><th>Squares</th><th>Gives</th><th>First give</th><th>Rule breaks</th></tr></thead><tbody>${rows.join("")}</tbody></table></div><p class="hint">Rule breaks come from the observers' tallies. Open a table to read its observer notes.</p></div>
  <div class="panel stack debrief"><h3>Debrief questions</h3><ol>
    <li>How did it feel to see a piece you needed sitting in front of someone else?</li>
    <li>Who gave pieces away early? What changed for the team when they did?</li>
    <li>Did anyone finish a square and then step back? What did that do to the rest of the table?</li>
    ${s.deal==="trap"?`<li>Seat ${TRAP_SEAT}, you had a square within seconds. When did you realise it was blocking the team? What did it take to break up something you'd already finished?</li>`:""}
    <li>Was there a moment the group switched from “my square” to “our squares”? What caused it?</li>
    <li>Where do we hold on to information or resources at work that another team needs?</li>
    <li>What is one habit you will take back to your team this week?</li>
  </ol></div></div>`;
}

/* ============ Events ============ */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");
  const mate=e.target.closest("[data-give]");
  if(!b&&mate&&S.selected&&canPlay()){ givePiece(S.selected,+mate.dataset.give); return; }
  if(!b) return;
  const a=b.dataset.act;
  if(a==="home"){ if(S.view==="play"||S.view==="observe"||S.view==="host"){ /* keep seat, just navigate */ } go("home"); return; }
  if(a==="join"){ if(!S.me) S.code=null; S.joinTeam=null; go("join"); return; }
  if(a==="host-list"){ if(!S.liveReady) return; go("host-list"); return; }
  if(a==="resume"){ const l=lsGet("bs.me"); if(!l) return; await resumeLive(l); if(S.view==="home"){ lsSet("bs.me",null); toast("That seat is no longer yours. The facilitator may have freed it or reset the session."); render(); } return; }
  if(a==="solo"){ startSolo(); go("solo"); return; }
  if(a==="ask-solo"){ $("#soloconfirm").innerHTML=`<div class="confirm" style="margin-bottom:12px"><span>Put every piece back in its starting envelope and restart the clock?</span><button class="btn danger sm" data-act="solo-reset">Reset all seats</button><button class="btn sm" data-act="solo-cancel">Cancel</button></div>`; return; }
  if(a==="solo-cancel"){ $("#soloconfirm").innerHTML=""; return; }
  if(a==="solo-reset"){ startSolo(); S.fresh={}; S.selected=null; $("#soloconfirm").innerHTML=""; update(); toast("All seats reset."); return; }
  if(a==="solo-seat"){ S.solo.seat=+b.dataset.seat; S.selected=null; update(); return; }
  if(a==="pick-session"){ S.code=b.dataset.code; S.session=S.sessions.find(x=>x.id===S.code)||null; subscribeSession(S.code,{all:true}); render(); return; }
  if(a==="back-sessions"){ clearSubs(); S.code=null; S.joinTeam=null; render(); return; }
  if(a==="claim"){ if(!S.liveReady){toast("Not connected to the game yet. Check your connection and reload.");return;} const nk=$("#nick"); if(nk) S.nick=nk.value; const d=S.seats["t"+b.dataset.team+"s"+b.dataset.seat]; if(d&&d.uid===S.uid){ S.me={team:+b.dataset.team,seat:+b.dataset.seat}; lsSet("bs.me",{code:S.code,...S.me}); subscribeSession(S.code,{team:S.me.team}); go("play"); return;} claimSeat(S.code,+b.dataset.team,+b.dataset.seat); return; }
  if(a==="auto-seat"){ const nk=$("#nick"); if(nk) S.nick=nk.value; const s=S.session||S.sessions.find(x=>x.id===S.code); if(!s) return;
    for(let t=1;t<=s.teams;t++){ if(S.joinTeam&&t!==S.joinTeam) continue; for(let n=1;n<=5;n++){ const d=S.seats["t"+t+"s"+n]; if(!d||!d.uid){ claimSeat(S.code,t,n); return; } } }
    toast(S.joinTeam?teamName(S.joinTeam)+" is full. Tap Show all teams to pick another.":"Every seat is taken. Ask the facilitator to add a team."); return; }
  if(a==="code-join"){ const c=($("#codein").value||"").trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(c)){toast("Codes are 4 letters or numbers, like K7QX.");return;} openJoinLink({code:c,team:null}); return; }
  if(a==="all-teams"){ S.joinTeam=null; update(); return; }
  if(a==="qr"){ showQR(b.dataset.team?+b.dataset.team:null); return; }
  if(a==="qr-close"){ hideQR(); return; }
  if(a==="copy-link"){ const u=b.dataset.url; try{ await navigator.clipboard.writeText(u); toast("Link copied"); }catch(err){ const l=document.querySelector(".linkline"); if(l){const r=document.createRange();r.selectNodeContents(l);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);} toast("Press Ctrl+C or ⌘C to copy the selected link."); } return; }
  if(a==="observe-team"){ const t=+b.dataset.team; S.me={team:t,observer:true}; S.obsTeam=t; lsSet("bs.me",{code:S.code,team:t,observer:true}); subscribeSession(S.code,{team:t}); go("observe"); return; }
  if(a==="leave-ask"){ $("#leavebox").innerHTML=`<div class="panel stack" style="margin-bottom:12px;border-color:var(--accent)"><h3>Leaving your seat?</h3>
      <div class="row" style="align-items:stretch">
        <button class="btn primary" data-act="leave-keep" style="flex:1;min-width:220px;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px"><span>Keep my seat</span><span class="small" style="font-weight:400;opacity:.9">Your seat and pieces stay as they are. Come back on this phone by scanning again or reopening the page.</span></button>
        <button class="btn" data-act="leave-free" style="flex:1;min-width:220px;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px"><span>Give up my seat</span><span class="small muted" style="font-weight:400">Someone else can take it. Your pieces stay on the table for them.</span></button>
      </div><button class="btn sm ghost" data-act="leave-cancel" style="align-self:flex-start">Stay at the table</button></div>`; window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(a==="leave-cancel"){ $("#leavebox").innerHTML=""; return; }
  if(a==="leave-keep"){ markPresence(false); clearSubs(); S.code=null; S.session=null; S.me=null; go("home"); toast("Your seat is saved. Scan the QR again or reopen this page to return."); return; }
  if(a==="leave-free"){ markPresence(false); await releaseMySeat(); clearSubs(); lsSet("bs.me",null); S.me=null; S.code=null; S.session=null; go("home"); toast("You've given up your seat."); return; }
  if(a==="leave"){ await releaseMySeat(); clearSubs(); lsSet("bs.me",null); S.me=null; S.code=null; S.session=null; go("home"); return; }
  if(a==="create"){ const title=$("#stitle").value.trim(); const n=clamp(parseInt($("#steams").value,10)||1,1,20); const dl=(document.querySelector('input[name="deal"]:checked')||{}).value||"trap"; const pin=($("#spin").value||"").trim(); if(!/^\d{4,8}$/.test(pin)){toast("Choose a facilitator PIN of 4 to 8 digits.");$("#spin").focus();return;} b.disabled=true; await createSession(title,n,dl,pin); b.disabled=false; return; }
  if(a==="claim-host"){ const c=($("#mcode").value||"").trim().toUpperCase(); const pin=($("#mpin").value||"").trim(); if(!/^[A-Z0-9]{4}$/.test(c)||!/^\d{4,8}$/.test(pin)){toast("Type the 4-letter session code and its PIN.");return;} claimHost(c,pin); return; }
  if(a==="free-seat"){ S.confirm="free:"+b.dataset.seat; update(); return; }
  if(a==="do-free"){ const id=b.dataset.seat; S.confirm=null; update(); freeSeat(id); return; }
  if(a==="do-delete"){ S.confirm=null; deleteSession(); return; }
  if(a==="manage"){ lsSet("bs.me",{code:b.dataset.code,host:true}); S.session=S.sessions.find(x=>x.id===b.dataset.code); subscribeSession(b.dataset.code,{all:true}); S.hostTab="teams"; go("host"); return; }
  if(a==="status"){ setStatus(b.dataset.st); return; }
  if(a==="ask"){ S.confirm=b.dataset.what; if(S.view!=="host"){ go("host"); return; } update(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(a==="cancel-ask"){ S.confirm=null; update(); return; }
  if(a==="do-end"){ S.confirm=null; await setStatus("ended"); return; }
  if(a==="do-reset"){ S.confirm=null; update(); await resetSession(); return; }
  if(a==="do-reset-team"){ S.confirm=null; update(); await resetTeam(+b.dataset.team); return; }
  if(a==="clear-square"){ clearMySquare(); return; }
  if(a==="add-team"){ addTeam(); return; }
  if(a==="toggle-tables"){ const v=!S.session.showTables; R(`sessions/${S.code}/showTables`).set(v).then(()=>toast(v?"Players can now see their teammates' tables.":"Teammates' tables are hidden from players.")).catch(()=>toast("Couldn't change that setting.")); return; }
  if(a==="host-tab"){ S.hostTab=b.dataset.tab; update(); return; }
  if(a==="obs-from-host"){ S.obsTeam=+b.dataset.team; go("observe"); return; }
  if(a==="obs-team"){ S.obsTeam=+b.dataset.team; render(); return; }
  if(a==="to-host"){ go("host"); return; }
  if(a==="tally"){ const k=b.dataset.k; R(`notes/${S.code}/t${S.obsTeam}/tallies/${k}`).transaction(v=>(v||0)+1).catch(()=>toast("That tally didn't save.")); return; }
  if(a==="rotate"){ rotateSel(); return; }
  if(a==="flip"){ flipSel(); return; }
  if(a==="give"){ if(S.selected) givePiece(S.selected,+b.dataset.seat); return; }
  if(a==="deselect"){ S.selected=null; update(); return; }
});
document.addEventListener("input",e=>{
  if(e.target.id==="nick"){ S.nick=e.target.value; return; }
  const k=e.target.dataset&&e.target.dataset.note; if(!k) return;
  noteDirty[k]=e.target.value; clearTimeout(noteTimer);
  $("#notesaved")&&($("#notesaved").textContent="Saving…");
  noteTimer=setTimeout(async()=>{const patch={answers:{...noteDirty}}; noteDirty={}; const ok=await saveNotes(patch); if(ok&&$("#notesaved")) $("#notesaved").textContent="Notes saved for everyone observing this team.";},900);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#qrov").hidden){hideQR();return;}
  const mate=e.target.closest&&e.target.closest("[data-give]");
  if(mate&&(e.key==="Enter"||e.key===" ")&&S.selected){e.preventDefault();givePiece(S.selected,+mate.dataset.give);return;}
  const g=e.target.closest&&e.target.closest("#myboard .pc"); if(!g||!canPlay()) return;
  const k=g.dataset.k; const p=curPieces()[k]; if(!p) return;
  S.selected=k;
  const portrait=isPortrait(); let [dx,dy]=toDisp(p,portrait); let moved=false;
  if(e.key==="ArrowLeft"){dx--;moved=true;} if(e.key==="ArrowRight"){dx++;moved=true;} if(e.key==="ArrowUp"){dy--;moved=true;} if(e.key==="ArrowDown"){dy++;moved=true;}
  if(moved){e.preventDefault(); const np=fromDisp(p,dx,dy,portrait); movePiece(k,{x:np.x,y:np.y}); refocus(k); return;}
  if(e.key==="r"||e.key==="R"){e.preventDefault();rotateSel();refocus(k);return;}
  if(e.key==="f"||e.key==="F"){e.preventDefault();flipSel();refocus(k);return;}
  if(/^[1-5]$/.test(e.key)&&+e.key!==p.owner){e.preventDefault();givePiece(k,+e.key);return;}
  if(e.key==="Escape"){S.selected=null;update();}
  if(e.key==="Enter"||e.key===" "){e.preventDefault();update();refocus(k);}
});
function refocus(k){requestAnimationFrame(()=>{const el=document.querySelector(`#myboard .pc[data-k="${k}"]`);el&&el.focus();});}
function rotateSel(){
  const p=S.selected&&curPieces()[S.selected]; if(!p||!canPlay()) return;
  const s0=shapeOf(p); const cx=p.x+s0.w/2, cy=p.y+s0.h/2;
  const q={...p,rot:(p.rot+1)%4}; const s1=shapeOf(q);
  movePiece(S.selected,{rot:q.rot,x:Math.round(cx-s1.w/2),y:Math.round(cy-s1.h/2)});
}
function flipSel(){
  const p=S.selected&&curPieces()[S.selected]; if(!p||!canPlay()) return;
  movePiece(S.selected,{flip:!p.flip,rot:(4-p.rot)%4});
}

/* ---- Drag ---- */
function svgPt(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
document.addEventListener("pointerdown",e=>{
  const svg=e.target.closest&&e.target.closest("#myboard"); if(!svg) return;
  const g=e.target.closest(".pc");
  if(!g){ if(S.selected){S.selected=null;update();} return; }
  if(!canPlay()) return;
  const k=g.dataset.k; const p=curPieces()[k]; if(!p) return;
  e.preventDefault();
  const portrait=isPortrait(); const [dx,dy]=toDisp(p,portrait); const pt=svgPt(svg,e);
  S.drag={k,svg,g,portrait,offX:pt.x-dx,offY:pt.y-dy,sx:e.clientX,sy:e.clientY,moved:false,over:null,id:e.pointerId};
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  svg.appendChild(g); // bring to front while dragging
});
document.addEventListener("pointermove",e=>{
  const d=S.drag; if(!d||e.pointerId!==d.id) return;
  if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<5) return;
  d.moved=true; d.g.classList.add("dragging");
  const pt=svgPt(d.svg,e); d.g.setAttribute("transform",`translate(${pt.x-d.offX} ${pt.y-d.offY})`);
  const el=document.elementFromPoint(e.clientX,e.clientY); const m=el&&el.closest&&el.closest("[data-give]");
  const over=m?+m.dataset.give:null;
  if(over!==d.over){ document.querySelectorAll(".mate.hover").forEach(x=>x.classList.remove("hover")); if(m) m.classList.add("hover"); d.over=over; }
});
function endDrag(e,cancel){
  const d=S.drag; if(!d||e.pointerId!==d.id) return;
  S.drag=null;
  const map=curPieces(); const p=map[d.k];
  if(!p){update();return;}
  if(cancel){update();return;}
  if(!d.moved){
    if(S.selected===d.k) rotateSel(); else { S.selected=d.k; update(); }
    S.pendingRender=false; refocus(d.k); return;
  }
  if(d.over&&d.over!==p.owner){ givePiece(d.k,d.over); S.pendingRender=false; return; }
  const pt=svgPt(d.svg,e); const np=fromDisp(p,pt.x-d.offX,pt.y-d.offY,d.portrait);
  const z=Math.max(0,...Object.values(map).map(q=>q.z||0))+1;
  S.selected=d.k; S.pendingRender=false;
  movePiece(d.k,{x:np.x,y:np.y,z});
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));

let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(["play","solo"].includes(S.view)) update();},150);});
})();
</script>
</body>
